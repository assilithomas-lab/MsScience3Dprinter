<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>What is my IP address?</title>    <style>        body {            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            display: flex;            justify-content: center;            align-items: center;            height: 100vh;            margin: 0;            background-color: #f4f7f6;            color: #333;        }        .container {            text-align: center;            background: white;            padding: 30px 50px;            border-radius: 12px;            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);        }        h1 {            font-size: 1.5rem;            color: #666;            margin-bottom: 10px;        }        .ip-box {            font-size: 2.5rem;            font-weight: bold;            color: #007BFF;            word-break: break-all;        }        .loading {            font-size: 1.2rem;            color: #999;            font-style: italic;        }    </style></head><body>    <div class="container">        <h1>Your IP Address is:192.168.166.15</h1>        <div id="ip" class="loading">Detecting your IP...</div>    </div>    <script>        // Uses the free, public ipify API to fetch the visitor's IP address        fetch('https://ipify.org')            .then(response => response.json())            .then(data => {                const ipElement = document.getElementById('ip');                ipElement.textContent = data.ip;                ipElement.classList.remove('loading');                ipElement.classList.add('ip-box');            })            .catch(error => {                document.getElementById('ip').textContent = "Could not detect IP address.";                console.error('Error fetching IP:', error);            });    </script></body></html>
